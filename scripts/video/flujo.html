const P = {
  shape: [2.3, 0.84], fast: [3.6, 0.82], lead: [4.6, 0.86], trail: [2.0, 0.92],
  cam: [1.5, 0.96], cursor: [2.6, 0.9], soft: [1.8, 1.0], pop: [4.2, 0.62], scroll: [1.9, 0.98],
};
function S(t, p) {
  if (t <= 0) return 0;
  const [f, z] = P[p] || p, w = 2 * Math.PI * f;
  if (z < 1) {
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
  }
  return 1 - Math.exp(-w * t) * (1 + w * t);
}
// Suma de un resorte por cambio de objetivo, periódica (f(0) === f(T) con la misma velocidad).
function track(ev, preset = "shape") {
  const n = ev.length;
  return (t) => {
    let v = ev[n - 1][1], prev = v;
    for (const e of ev) {
      const d = e[1] - prev; prev = e[1];
      const p = e[2] || preset;
      v += d * (S(t - e[0], p) + S(t - e[0] + T, p));
    }
    return v;
  };
}
const trackRGB = (ev, preset) => [0, 1, 2].map((i) => track(ev.map((e) => [e[0], e[1][i], e[2]]), preset));
const rgb = (tr, t) => `rgb(${tr.map((f) => Math.round(Math.min(255, Math.max(0, f(t))))).join(",")})`;
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = (x) => Math.pow(clamp(x), 2);
const mix = (a, c, k) => a + (c - a) * k;
const mixC = (a, c, k) => `rgb(${a.map((v, i) => Math.round(mix(v, c[i], k))).join(",")})`;
function win(t, a, z, dIn = 0.09, lIn = 0.2, lOut = 0.1) {
  let best = 0;
  for (const tt of [t, t + T, t - T]) best = Math.max(best, Math.min(easeOut((tt - a - dIn) / lIn), 1 - easeIn((tt - z) / lOut)));
  return best;
}
const press = (t, tc) => {
  let best = 0;
  for (const tt of [t, t + T, t - T]) {
    const x = tt - tc;
    if (x >= -0.07 && x < 0) best = Math.max(best, easeOut((x + 0.07) / 0.07));
    else if (x >= 0 && x < 0.6) best = Math.max(best, 1 - S(x, "fast"));
  }
  return clamp(best);
};

    s.c.style.background = mixC(WHITE, ACC, k); s.c.style.borderColor = mixC([222, 219, 214], ACC, k);
    s.x.style.color = mixC(INK, WHITE, k); s.x.style.fontSize = mix(18, 15, mob) + "px";
    s.c.style.transform = i === 1 ? `scale(${(1 - 0.06 * press(t, b(31))).toFixed(4)})` : "";
  });
  tglLbl.style.fontSize = mix(22, 18, mob) + "px";
  place(tglLbl, aL + 30, 232);
  const on = clamp(S(t - b(32), "fast"));
  place(tglTrack, aR - 30 - 92, 206);
  tglTrack.style.background = mixC([214, 211, 206], ACC, on);
  const kl = mix(aR - 30 - 92 + 6, aR - 30 - 46, clamp(S(t - b(32), "trail"))), kr = mix(aR - 30 - 92 + 46, aR - 30 - 6, clamp(S(t - b(32), "lead")));
  place(tglKnob, kl, 212, kr - kl, 40);
  // la capa del calendario usa coordenadas del mundo; su origen es el del grupo
  gCal.style.left = "0"; gCal.style.top = "0";

  // 05 · publicado
  showG(gPub, win(t, b(36), b(38)));
  pubBar.style.width = (640 * easeOut((t - b(36) - 0.12) / 0.75)).toFixed(1) + "px";
  showG(gToast, win(t, b(38), b(39)));
  showG(gNoti, win(t, b(39), b(40)));
  notiDot.style.transform = `scale(${Math.max(0, S(t - b(39) - 0.15, "pop")).toFixed(4)})`;

  // 06 · cierre
  showG(gBrand, win(t, b(40), b(43)));
  showG(gBrand2, win(t, b(41), b(43), 0, 0.24), 14);
  brandSq.style.transform = `scale(${Math.max(0, S(t - b(40) - 0.2, "pop")).toFixed(4)})`;

  // cursor
  const pr = pressedAt(t);
  const sx = 720 + cx * cam, sy = 720 + cy * cam;
  cursor.style.transform = `translate(${(sx - 6).toFixed(2)}px, ${(sy - 4).toFixed(2)}px) scale(${(1 - 0.16 * pr).toFixed(4)})`;
  // En la burbuja inicial escribe el cliente: el cursor aparece después y se va antes del loop.
  cursor.style.opacity = Math.min(clamp((t - b(2)) / 0.3), clamp((b(43) + 0.35 - t) / 0.3)).toFixed(3);

  // HUD
  const beat = t / BEAT;
  // En el último medio beat la barra se apaga, así el loop empalma con todo vacío.
  const fillO = t > b(43) ? 1 - easeIn((t - b(43)) / 0.45) : 1;
  ETAPAS.forEach(([a, z], i) => {
    pasoEls[i].style.width = (clamp((beat - a) / (z - a)) * 100).toFixed(2) + "%";
    pasoEls[i].style.opacity = fillO.toFixed(3);
    // el rótulo 01 arranca cuando vuelve la burbuja (beat 43) y el 06 termina ahí
    const o = i === 0 ? win(t, b(43), b(z) + T, 0.04, 0.18, 0.1) : win(t, b(a), b(i === 5 ? 43 : z), 0.04, 0.18, 0.1);
    etapaEls[i].style.opacity = o.toFixed(3);
    etapaEls[i].style.filter = o < 0.999 ? `blur(${((1 - o) * 6).toFixed(2)}px)` : "none";
  });
}
window.seek = seek;
window.DURATION = T;
document.fonts.ready.then(() => { seek(0); window.READY = true; });
