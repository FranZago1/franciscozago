<script>
"use strict";
// ───────────────────────── Tiempo ─────────────────────────
const BPM = 120, BEAT = 60 / BPM, BEATS = 28, T = BEATS * BEAT; // 7 compases = 14 s
const ACC = [14, 106, 112];        // acento del portfolio (#0E6A70)
const INK = [17, 17, 17], WHITE = [255, 255, 255], SOFT = [241, 239, 236], LINE = [222, 219, 214], MUTED = [110, 107, 102];

// Respuesta al escalón de un resorte (forma cerrada). f: Hz, z: amortiguamiento (<1 = leve overshoot).
const P = {
  shape: [2.3, 0.84], fast: [3.6, 0.82], lead: [4.6, 0.86], trail: [2.0, 0.92],
  cam: [1.5, 0.96], cursor: [2.6, 0.9], soft: [1.8, 1.0], pop: [4.2, 0.62],
};
function S(t, p) {
  if (t <= 0) return 0;
  const [f, z] = P[p] || p, w = 2 * Math.PI * f;
  if (z < 1) {
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
  }
  return 1 - Math.exp(-w * t) * (1 + w * t); // crítico
}
// Valor que cambia de objetivo muchas veces = suma de un resorte por cambio.
// Es periódico: el último objetivo es el valor previo al primero y se suma la copia del loop anterior,
// así f(0) === f(T) con posición y velocidad idénticas.
function track(ev, preset = "shape") {
  const n = ev.length;
  return (t) => {
    let v = ev[n - 1][1], prev = v;
    for (const e of ev) {
      const d = e[1] - prev; prev = e[1];
      const p = e[2] || preset;
      v += d * (S(t - e[0], p) + S(t - e[0] + T, p));
    }
    return v;
  };
}
const trackRGB = (ev, preset) => [0, 1, 2].map((i) => track(ev.map((e) => [e[0], e[1][i], e[2]]), preset));
const rgb = (tr, t) => `rgb(${tr.map((f) => Math.round(Math.min(255, Math.max(0, f(t))))).join(",")})`;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = (x) => Math.pow(clamp(x), 2);
const mix = (a, b, k) => a + (b - a) * k;
const mixC = (a, b, k) => `rgb(${a.map((v, i) => Math.round(mix(v, b[i], k))).join(",")})`;

// Ventana de visibilidad para contenido que entra y sale de un contenedor que se transforma.
// Entra con un pequeño retraso (mientras el contenedor ya cambia) y sale antes de que el siguiente entre.
function win(t, a, b, dIn = 0.09, lIn = 0.2, lOut = 0.1) {
  let best = 0;
  for (const tt of [t, t + T, t - T]) {
    const i = easeOut((tt - a - dIn) / lIn);
    const o = 1 - easeIn((tt - b) / lOut);
    best = Math.max(best, Math.min(i, o));
  }
  return best;
}
// Pulso corto (clic) periódico.
function pulse(t, tc, dur = 0.16) {
  let best = 0;
  for (const tt of [t, t + T, t - T]) {
    const x = (tt - tc) / dur;
    if (x > -0.35 && x < 1) best = Math.max(best, x < 0 ? 1 - easeIn(-x / 0.35) * 0 - (1 - easeOut(1 + x / 0.35)) : 1 - easeOut(x));
  }
  return best;
}
const press = (t, tc) => { // 0..1..0 alrededor del clic: baja rápido antes y vuelve con resorte
  let best = 0;
  for (const tt of [t, t + T, t - T]) {
    const x = tt - tc;
    if (x >= -0.07 && x < 0) best = Math.max(best, easeOut((x + 0.07) / 0.07));
    else if (x >= 0 && x < 0.6) best = Math.max(best, 1 - S(x, "fast"));
  }
  return clamp(best);
};

// ───────────────────────── DOM helpers ─────────────────────────
const L = document.getElementById("L");
function el(tag, style = {}, html = "", parent = L) {
  const e = document.createElement(tag);
  Object.assign(e.style, style);
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
function box(x, y, w, h, style = {}, html = "", parent = L) {
  return el("div", { position: "absolute", left: x - w / 2 + "px", top: y - h / 2 + "px", width: w + "px", height: h + "px", ...style }, html, parent);
}
function text(x, y, html, style = {}, parent = L, anchor = "c") {
  const e = el("div", { position: "absolute", left: x + "px", top: y + "px", whiteSpace: "nowrap", ...style }, html, parent);
  e.style.transform = anchor === "c" ? "translate(-50%,-50%)" : anchor === "l" ? "translate(0,-50%)" : "translate(-100%,-50%)";
  e.dataset.anchor = anchor;
  return e;
}
const group = () => el("div", { position: "absolute", left: "0", top: "0" });
// Aplica la visibilidad de una ventana a un grupo: opacidad + desenfoque + leve desplazamiento.
function showG(g, o, dy = 10) {
  g.style.opacity = o.toFixed(3);
  g.style.filter = o < 0.999 ? `blur(${((1 - o) * 9).toFixed(2)}px)` : "none";
  g.style.transform = `translateY(${((1 - o) * dy).toFixed(2)}px) scale(${(0.97 + 0.03 * o).toFixed(4)})`;
  g.style.visibility = o < 0.002 ? "hidden" : "visible";
}

const CAM = track([[b(1), 2.5], [b(3), 1.16], [b(4), 1.04], [b(6), 1.0], [b(10), 1.16], [b(12), 0.95], [b(15), 1.08], [b(20), 1.06], [b(24), 1.38], [b(25), 1.02], [b(27), 1.72]], "cam");

  const g = el("div", { position: "absolute", left: "-414px", width: "828px", height: "68px", borderRadius: "18px" }, "", kTop);
  el("div", { position: "absolute", left: "26px", top: "19px" }, ICON(ic, 30, "currentColor", 2.2), g);
  el("div", { position: "absolute", left: "78px", top: "15px", font: "500 30px Hanken", whiteSpace: "nowrap" }, label, g);
  const enter = el("div", { position: "absolute", right: "22px", top: "16px", font: "500 18px JB", border: "2px solid currentColor", borderRadius: "8px", padding: "3px 8px", opacity: "0" }, "↵", g);
  return { g, enter };
});
const KEYS = [10.5, 10.75, 11.0, 11.25], WORD = "publ";

// 24 · Toast
const gToast = group();
box(-252, 0, 60, 60, { background: `rgb(${ACC})`, borderRadius: "999px", display: "grid", placeItems: "center" }, ICON(I.check, 32, "#fff", 2.8), gToast);
text(-206, 0, "Sitio publicado", { font: "600 36px Hanken", color: "#fff", letterSpacing: "-0.02em" }, gToast, "l");
text(284, 2, "tunegocio.com", { font: "500 20px JB", color: "#A8A49D", letterSpacing: "0.04em" }, gToast, "r");

// 25-26 · Cierre de marca
const gBrand = group();
const brandName = text(0, -38, `Francisco Zago<span id="sq" style="display:inline-block;width:26px;height:26px;margin-left:10px;background:rgb(${ACC})"></span>`, { font: "600 128px Hanken", letterSpacing: "-0.055em" }, gBrand);
const brandSq = document.getElementById("sq");
const gBrand2 = group();
box(0, 76, 860, 2, { background: "#111" }, "", gBrand2);
text(-430, 128, "Desarrollo web", { font: "500 24px JB", letterSpacing: "0.12em", textTransform: "uppercase" }, gBrand2, "l");
text(430, 128, "franciscozago.dev", { font: "500 24px JB", letterSpacing: "0.06em", color: `rgb(${ACC})` }, gBrand2, "r");

// Píldora compartida: perilla del toggle → indicador de tabs (bordes con resortes distintos).
const pill = el("div", { position: "absolute" });
const gTabs = group();
const TABS = ["Ventas", "Turnos", "Clientes"];
const tabEls = TABS.map((s, i) => text(-260 + i * 260, 0, s, { font: "600 34px Hanken", letterSpacing: "-0.02em" }, gTabs));

// Bordes de la píldora. El borde hacia donde se mueve usa "lead" y el otro "trail".
const PL = track([[b(9), 296, "trail"], [b(10), -382, "lead"], [b(11), -122, "trail"], [b(27), 230, "soft"]]);
const PR = track([[b(9), 364, "lead"], [b(10), -138, "trail"], [b(11), 122, "lead"], [b(27), 298, "soft"]]);
const PT = track([[b(10), -46], [b(12), -300], [b(27), 166, "soft"]]);
const PB = track([[b(10), 46], [b(12), -208], [b(27), 234, "soft"]]);
const PC = trackRGB([[b(10), INK], [b(27), WHITE, "soft"]], "shape");
const TABY = track([[b(12), -254], [b(27), 0, "soft"]]);
const DAYL = track([[b(7), dayX(3) - 48, "trail"], [b(27), dayX(0) - 48, "soft"]]);
const DAYR = track([[b(7), dayX(3) + 48, "lead"], [b(27), dayX(0) + 48, "soft"]]);
const TIPX = track([[b(13), 184], [b(14), 424]], "fast");
const TIPY = track([[b(13), py(30)], [b(14), py(36)]], "fast");

// Regla de beats (motivo del portfolio)
const regla = document.getElementById("regla");
const ticks = [...Array(BEATS)].map((_, i) => el("div", { position: "absolute", left: `calc(${(i / (BEATS - 1)) * 100}% - 1px)`, top: i % 4 === 0 ? "0" : "5px", width: "2px", height: i % 4 === 0 ? "14px" : "9px", background: "#B8B4AD" }, "", regla));

const SECC = [[0, 3, "Botón · CTA"], [3, 4, "Marca"], [4, 6, "E-commerce"], [6, 10, "Reservas"], [10, 15, "Dashboard"], [15, 20, "Cotizador"], [20, 24, "Web app"], [24, 25, "Publicado"], [25, 28, "Portfolio"]];
const seccion = document.getElementById("seccion");
const seccEls = SECC.map(([, , s]) => el("span", { position: "absolute", left: "0", bottom: "0", whiteSpace: "nowrap" }, s, seccion));

const shape = document.getElementById("shape"), stage = document.getElementById("stage"), cursor = document.getElementById("cursor");

// ───────────────────────── seek(t): todo se calcula desde t ─────────────────────────
function seek(tIn) {
  const t = ((tIn % T) + T) % T;
  const w = W(t), h = H(t), r = Math.min(R(t), w / 2, h / 2), cam = CAM(t);
  const sq = 1 - 0.035 * press(t, b(1)); // el botón se hunde al clic
  stage.style.transform = `scale(${cam.toFixed(5)})`;
  Object.assign(shape.style, {
    left: (-w / 2) + "px", top: (-h / 2) + "px", width: w + "px", height: h + "px",
    borderRadius: r + "px", background: rgb(BG, t), transform: `scale(${sq.toFixed(4)})`,
  });
  L.style.left = w / 2 + "px"; L.style.top = h / 2 + "px";

  // Botón y loader
  showG(gBtn, win(t, b(27), b(29)));
  showG(gLoad, win(t, b(1), b(2), 0.06, 0.14));
  spin.style.transform = `translate(-50%,-50%) rotate(${(t * 520) % 360}deg)`;
  showG(gCheck, win(t, b(2), b(3), 0.04, 0.12));
  chkPath.setAttribute("stroke-dashoffset", (1 - easeOut((t - b(2) - 0.06) / 0.3)).toFixed(4));
  showG(gIsland, win(t, b(3), b(4)));
  islDot.style.transform = `scale(${(1 + 0.25 * press(t, b(3) + 0.25)).toFixed(3)})`;

  // Producto
  showG(gProd, win(t, b(4), b(6)));
  const pa = press(t, b(5));
  const added = S(t - b(5), "fast");
  addBtn.style.transform = `scale(${(1 - 0.03 * pa).toFixed(4)})`;
  addBtn.style.background = mixC(INK, ACC, clamp(added));
  addA.style.opacity = (1 - clamp(added * 1.6)).toFixed(3);
  addA.style.filter = `blur(${(clamp(added) * 8).toFixed(2)}px)`;
  addB.style.opacity = clamp((added - 0.3) * 1.6).toFixed(3);
  addB.style.filter = `blur(${((1 - clamp((added - 0.3) * 1.6)) * 8).toFixed(2)}px)`;
  const bp = S(t - b(5) - 0.08, "pop");
  badge.style.transform = `scale(${Math.max(0, bp).toFixed(4)})`;

  // Reservas
  showG(gCal, win(t, b(6), b(10)));
  const dl = DAYL(t), dr = DAYR(t);
  dayInd.style.left = dl + "px"; dayInd.style.width = (dr - dl) + "px";
  dayInd.style.transform = `scale(${(1 - 0.04 * press(t, b(7))).toFixed(4)})`;
  dayEls.forEach(([a, c], i) => {
    const x0 = dayX(i) - 48, x1 = dayX(i) + 48;
    const k = clamp((Math.min(dr, x1) - Math.max(dl, x0)) / 96);
    a.style.color = mixC([110, 107, 102], WHITE, k); c.style.color = mixC(INK, WHITE, k);
  });
  slotEls.forEach(([bx, tx], i) => {
    const k = i === 1 ? clamp(S(t - b(8), "fast")) * win(t, b(6), b(10)) : 0;
    bx.style.background = mixC(WHITE, ACC, k); bx.style.borderColor = mixC([222, 219, 214], ACC, k);
    tx.style.color = mixC(INK, WHITE, k);
    bx.style.transform = i === 1 ? `scale(${(1 - 0.05 * press(t, b(8))).toFixed(4)})` : "";
  });
  const on = clamp(S(t - b(9), "fast")) * (t < b(27) ? 1 : 0);
  tglTrack.style.background = mixC([214, 211, 206], ACC, on);

  // Píldora (perilla → indicador)
  const l = PL(t), rr = PR(t), tp = PT(t), bt = PB(t);
  const pillO = Math.max(win(t, b(6), b(15)), 0);
  Object.assign(pill.style, {
    left: l + "px", top: tp + "px", width: Math.max(0, rr - l) + "px", height: Math.max(0, bt - tp) + "px",
    borderRadius: Math.max(0, (bt - tp) / 2) + "px", background: rgb(PC, t), opacity: pillO.toFixed(3),
    boxShadow: t < b(10.2) ? "0 2px 6px rgba(0,0,0,.18)" : "none",
    visibility: pillO < 0.002 ? "hidden" : "visible",
  });
  pill.style.transform = `scale(${(1 - 0.08 * press(t, b(9))).toFixed(4)})`;

  // Tabs + gráfico
  showG(gTabBg, win(t, b(12), b(15)), 0);
  showG(gTabs, win(t, b(10), b(15), 0.12), 0);
  const ty = TABY(t);
  tabEls.forEach((e, i) => {
    const cx = -260 + i * 260;
    e.style.top = ty + "px";
    const k = clamp((Math.min(rr, cx + 122) - Math.max(l, cx - 122)) / 244) * clamp((Math.min(bt, ty + 46) - Math.max(tp, ty - 46)) / 92);
    e.style.color = mixC([110, 107, 102], WHITE, k);
  });
  showG(gChart, win(t, b(12), b(15), 0.12));
  const draw = easeOut((t - b(12) - 0.12) / 0.62);
  linea.setAttribute("stroke-dashoffset", (1 - draw).toFixed(4));
  clipR.setAttribute("width", (20 + draw * 860).toFixed(1));
  ptos.forEach((p, i) => {
    const k = clamp((draw - i / 7) * 8 + 0.6);
    p.setAttribute("r", (9 * easeOut(k)).toFixed(2));
  });
  const tipO = win(t, b(13), b(15), 0.02, 0.16);
  const tx = TIPX(t), tyy = TIPY(t);
  guia.setAttribute("x1", (tx + 440).toFixed(1)); guia.setAttribute("x2", (tx + 440).toFixed(1));
  guia.style.opacity = tipO.toFixed(3);
  showG(gTip, tipO, 6);
  tip.style.left = (tx > 300 ? tx - 250 - 26 : tx - 125) + "px"; tip.style.top = (tyy - 100 + 130 - 4) + "px";
  const sw = clamp((t - b(14)) / 0.18);
  tipA.style.opacity = (1 - sw).toFixed(3); tipA.style.filter = `blur(${(sw * 6).toFixed(2)}px)`;
  tipB.style.opacity = sw.toFixed(3); tipB.style.filter = `blur(${((1 - sw) * 6).toFixed(2)}px)`;

  // Slider: manipulación directa mientras el cursor está apretado; al soltar vuelve con resorte.
  showG(gSl, win(t, b(15), b(20)));
  const cxw = CX(t), cyw = CY(t);
  const MIN = -380, MAX = 330, V0 = MIN + 0.4 * (MAX - MIN);
  const rubber = (x) => (x <= MAX ? Math.max(MIN, x) : MAX + (x - MAX) * 0.3 / (1 + (x - MAX) / 300));
  let thumb;
  if (t < HOLD[0]) thumb = V0;
  else if (t < HOLD[1]) thumb = rubber(V0 + (cxw - CX(HOLD[0])));
  else { const rel = rubber(V0 + (CX(HOLD[1]) - CX(HOLD[0]))); thumb = rel + (MAX - rel) * S(t - HOLD[1], "fast"); }
  const over = Math.max(0, thumb - MAX);
  const tw = 56 + over * 0.55;
  slThumb.style.left = (thumb - tw / 2 - over * 0.25) + "px"; slThumb.style.width = tw + "px";
  slFill.style.width = Math.max(0, thumb - MIN) + "px";
  const m2 = Math.round(20 + clamp((thumb - MIN) / (MAX - MIN)) * 100);
  slVal.textContent = `${m2} m²`;

  // ⌘K
  showG(gK, win(t, b(20), b(24)));
  kTop.style.top = (-h / 2) + "px";
  const n = KEYS.filter((k) => t >= k).length;
  kTxt.textContent = WORD.slice(0, n);
  kPh.style.opacity = n ? "0" : "1";
  kCaret.style.left = (-334 + kTxt.getBoundingClientRect().width / Math.max(cam, 0.01) + 4) + "px";
  kCaret.style.opacity = (t % BEAT) < BEAT * 0.55 || (t > 10.4 && t < 11.5) ? "1" : "0";
  let y = 150;
  let firstVisible = -1;
  itemEls.forEach(({ g, enter }, i) => {
    const hide = OCULTA[i] === null ? 0 : clamp(S(t - OCULTA[i], "fast"));
    const k = 1 - hide;
    if (firstVisible < 0 && k > 0.5) firstVisible = i;
    g.style.top = y + "px";
    g.style.opacity = clamp(k * 1.4 - 0.4).toFixed(3);
    g.style.filter = k < 0.99 ? `blur(${((1 - k) * 8).toFixed(2)}px)` : "none";
    g.style.transform = `scale(${(0.96 + 0.04 * k).toFixed(4)})`;
    y += 76 * k;
  });
  const ep = press(t, b(23));
  const sel = clamp(S(t - b(23), "fast"));
  itemEls.forEach(({ g, enter }, i) => {
    const isSel = i === firstVisible;
    const dark = i === 3 ? sel : 0;
    g.style.background = isSel ? mixC(SOFT, INK, dark) : "transparent";
    g.style.color = isSel ? mixC(INK, WHITE, dark) : "#111";
    enter.style.opacity = isSel && i === 3 ? "1" : "0";
    if (i === 3) g.style.transform = `scale(${(1 - 0.03 * ep).toFixed(4)})`;
  });

  // Toast y cierre
  showG(gToast, win(t, b(24), b(25)));
  showG(gBrand, win(t, b(25), b(27)));
  showG(gBrand2, win(t, b(26), b(27), 0.0, 0.22), 14);
  brandSq.style.transform = `scale(${Math.max(0, S(t - b(25) - 0.2, "pop")).toFixed(4)})`;

  // Cursor (tamaño fijo en pantalla)
  let pr = 0;
  for (const c of CLICKS) pr = Math.max(pr, press(t, c));
  if (t >= HOLD[0] - 0.07 && t < HOLD[1]) pr = Math.max(pr, t < HOLD[0] ? easeOut((t - HOLD[0] + 0.07) / 0.07) : 1);
  else pr = Math.max(pr, press(t, HOLD[1]) * (t >= HOLD[1] ? 1 : 0));
  const sx = 720 + cxw * cam, sy = 720 + cyw * cam;
  cursor.style.transform = `translate(${(sx - 6).toFixed(2)}px, ${(sy - 4).toFixed(2)}px) scale(${(1 - 0.16 * pr).toFixed(4)})`;

  // HUD
  const beat = Math.floor(t / BEAT + 1e-6);
  ticks.forEach((e, i) => (e.style.background = i === beat ? `rgb(${ACC})` : i < beat ? "#8E8A83" : "#C9C5BE"));
  SECC.forEach(([a, z], i) => {
    const o = win(t, b(a), b(z), 0.04, 0.18, 0.1);
    seccEls[i].style.opacity = o.toFixed(3);
    seccEls[i].style.filter = o < 0.999 ? `blur(${((1 - o) * 6).toFixed(2)}px)` : "none";
  });
}
window.seek = seek;
window.DURATION = T;
document.fonts.ready.then(() => { seek(0); window.READY = true; });
</script>
